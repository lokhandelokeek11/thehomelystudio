<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Mobile Responsive & Safe Area Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDFC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Primary Meta Tags -->
    <title>The Homely Studio | Premium Handcrafted Festive Decor & Deity Haar</title>
    <meta name="title" content="The Homely Studio | Premium Handcrafted Festive Decor & Deity Haar" />
    <meta name="description" content="Discover exquisite handcrafted deity garlands, festive decor, hair accessories, custom keychains, and home embellishments thoughtfully designed by The Homely Studio in Ravet, Pune." />

    <!-- Open Graph / Facebook / Instagram / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Homely Studio" />
    <meta property="og:title" content="The Homely Studio | Premium Handcrafted Festive Decor Showcase" />
    <meta property="og:description" content="Exquisite deity garlands, sacred mandir asaans, boho curtain tiebacks, and personalized gifts handcrafted in Ravet, Pune." />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="The Homely Studio | Premium Handcrafted Festive Decor Showcase" />
    <meta property="twitter:description" content="Exquisite deity garlands, sacred mandir asaans, boho curtain tiebacks, and personalized gifts handcrafted in Ravet, Pune." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-brand-bg text-brand-text font-sans antialiased selection:bg-brand-accent/20 selection:text-brand-primary min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Service Worker Registration Placeholder -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration skipped or failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
